<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #0d1117; color: #e6edf3;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
         font-size: 16px; line-height: 1.5; }
  .page { width: 880px; padding: 40px 45px 60px; }
  a { color: #4493f8; text-decoration: none; }
  h1 { font-size: 2em; font-weight: 600; border-bottom: 1px solid #30363d; padding-bottom: .3em; margin: 24px 0 16px; }
  h2 { font-size: 1.5em; font-weight: 600; border-bottom: 1px solid #30363d; padding-bottom: .3em; margin: 24px 0 16px; }
  p { margin: 0 0 16px; }
  img.hero { width: 100%; border-radius: 12px; display: block; margin-bottom: 20px; }
  .badges img { height: 24px; margin: 0 6px 6px 0; vertical-align: middle; height: 24px; }
  h3 { font-size: 1.15em; margin: 20px 0 10px; }
  pre { background: #161b22; border-radius: 6px; padding: 12px 16px; overflow: hidden; font-size: 13.5px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: #e6edf3; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 8px 0 24px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; border-radius: 10px; display: block; background: #000; }
  .shots figcaption { color: #9198a1; font-size: 12.5px; text-align: center; margin-top: 6px; }
  table { border-collapse: collapse; margin: 0 0 16px; font-size: 15px; width: 100%; }
  th, td { border: 1px solid #30363d; padding: 6px 13px; text-align: left; vertical-align: top; }
  th { background: #161b22; font-weight: 600; }
  td:first-child { white-space: nowrap; color: #e6edf3; }
  blockquote { margin: 0 0 16px; padding: 0 1em; color: #9198a1; border-left: .25em solid #30363d; }
  ul { padding-left: 2em; margin: 0 0 16px; }
  li { margin: 4px 0; }
</style>
<div class="page" id="page"></div>
<script>
  // The README as written, rendered the way GitHub renders it, for a look before committing.
  fetch('README.preview.md').then((r) => r.text()).then((text) => {
    const lines = text.split('\n');
    const html = [];
    let list = false, table = false, pre = false, para = [];
    const flushPara = () => { if (para.length) { html.push(`<p>${para.join(' ')}</p>`); para = []; } };
    const bold = (s) => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (pre) { if (line.startsWith('```')) { pre = false; html.push('</pre>'); } else html.push(line.replace(/</g, '&lt;')); continue; }
      if (line.startsWith('```')) { flushPara(); if (list) { html.push('</ul>'); list = false; } pre = true; html.push('<pre>'); continue; }
      if (/^# /.test(line)) { flushPara(); html.push(`<h1>${bold(line.slice(2))}</h1>`); continue; }
      if (/^## /.test(line)) { flushPara(); html.push(`<h2>${bold(line.slice(3))}</h2>`); continue; }
      if (/^### /.test(line)) { flushPara(); html.push(`<h3>${bold(line.slice(4))}</h3>`); continue; }
      if (/^> /.test(line)) { flushPara(); html.push(`<blockquote>${bold(line.slice(2))}</blockquote>`); continue; }
      if (/^\|/.test(line)) {
        flushPara();
        if (!table) { html.push('<table>'); table = true; }
        if (/^\|[\s:|-]*-[\s:|-]*\|/.test(line) && !/[一-鿿A-Za-z]/.test(line)) continue;
        const cells = line.split('|').slice(1, -1).map((c) => bold(c.trim()));
        const sep = (l) => /^\|[\s:|-]*-[\s:|-]*\|/.test(l) && !/[一-鿿A-Za-z]/.test(l);
        const tag = sep(lines[i + 1] || '') ? 'th' : 'td';
        html.push('<tr>' + cells.map((c) => `<${tag}>${c}</${tag}>`).join('') + '</tr>');
        continue;
      }
      if (table && !/^\|/.test(line)) { html.push('</table>'); table = false; }
      if (/^- /.test(line)) { flushPara(); if (!list) { html.push('<ul>'); list = true; } html.push(`<li>${bold(line.slice(2))}</li>`); continue; }
      if (list && !/^- /.test(line)) { html.push('</ul>'); list = false; }
      if (line.startsWith('<')) { flushPara(); html.push(line); continue; }
      if (!line.trim()) { flushPara(); continue; }
      para.push(bold(line));
    }
    flushPara(); if (list) html.push('</ul>'); if (table) html.push('</table>');
    document.getElementById('page').innerHTML = html.join('\n');
  });
</script>
