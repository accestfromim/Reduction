<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Reduction</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./css/app.css" />
<link rel="stylesheet" href="./vendor/katex/katex.min.css" />
</head>
<body>
  <!-- The logo: three equal circles, one in the middle and two behind it of which only an arc shows. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="glyph" viewBox="100 150 312 212">
      <circle cx="256" cy="256" r="82"></circle>
      <path d="M188.26,174.47A82,82 0 0,0 188.26,337.53A106,106 0 0,1 188.26,174.47Z"></path>
      <path d="M323.74,174.47A82,82 0 0,1 323.74,337.53A106,106 0 0,0 323.74,174.47Z"></path>
    </symbol>
  </svg>

  <!-- Opening animation: the logo assembles itself, then shrinks into its box in the top bar.
       The middle circle waits; the other two fly in from the sides and slide behind it, where
       a ring of background hides all but an arc. -->
  <div class="splash" id="splash" aria-hidden="true">
    <svg viewBox="0 0 512 512">
      <circle class="splash-side from-left" cx="197" cy="256" r="82"></circle>
      <circle class="splash-side from-right" cx="315" cy="256" r="82"></circle>
      <circle class="splash-gap" cx="256" cy="256" r="106"></circle>
      <circle class="splash-core" cx="256" cy="256" r="82"></circle>
    </svg>
  </div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo"><svg class="glyph" id="logoGlyph" aria-hidden="true"><use href="#glyph"></use></svg></div>
        <div class="brand-text">
          <div class="app-title">Reduction</div>
          <div class="status" id="status"></div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="pc-pill offline" id="pcPill" aria-label="电脑连接状态">
          <span class="pc-dot"></span>
          <span id="pcPillText">未连接</span>
        </button>
        <button class="update-pill hidden" id="updatePill" aria-label="软件更新">
          <span class="update-dot"></span>
          <span id="updatePillText">可更新</span>
        </button>
        <div class="header-actions">
        <button class="icon-btn" id="pcBtn" aria-label="电脑">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"></rect>
            <path d="M8 20h8M12 16v4"></path>
          </svg>
        </button>
        <button class="icon-btn" id="settingsBtn" aria-label="设置">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
        </button>
        </div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" id="tabStream">朗读</button>
      <button class="tab" id="tabCards">卡片</button>
    </nav>

    <section class="page" id="streamPage">
    <main class="messages" id="messages"></main>

    <section class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg class="glyph" aria-hidden="true"><use href="#glyph"></use></svg>
      </div>
      <div class="empty-title">你的随身语音助手</div>
    </section>

    <footer class="composer">
      <div class="recording-bar hidden" id="recordingBar">
        <span class="recording-dot"></span>
        <span id="recordingTime">00:00</span>
        <span class="recording-hint" id="recordingHint">松开发送</span>
        <button class="text-btn" id="finishRecording">结束</button>
        <button class="text-btn" id="cancelRecording">取消</button>
      </div>

      <div class="voice-mode" id="voiceMode">
        <button class="mic-btn big" id="micBtn" aria-label="长按说话，轻点出键盘">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path>
            <path d="M19 11a7 7 0 0 1-14 0"></path>
            <path d="M12 18v3"></path>
          </svg>
        </button>
        <div class="composer-hint" id="composerHint"></div>
      </div>

      <div class="text-mode hidden" id="textMode">
        <button class="mode-btn" id="voiceBtn" aria-label="切换到语音">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path>
            <path d="M19 11a7 7 0 0 1-14 0"></path>
            <path d="M12 18v3"></path>
          </svg>
        </button>
        <input class="text-input" id="textInput" type="text" placeholder="输入消息" autocomplete="off" />
        <button class="send-btn" id="sendBtn" aria-label="发送" disabled>
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13"></path>
            <path d="M22 2 15 22l-4-9-9-4z"></path>
          </svg>
        </button>
      </div>
    </footer>
    </section>

    <section class="page hidden" id="cardsPage">
      <div class="card-list" id="cardList"></div>
      <button class="card-new" id="cardNew">＋ 新卡片</button>
    </section>
  </div>

  <div class="card-page hidden" id="cardPage">
    <header class="card-page-head">
      <button class="icon-btn" id="cardBack" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"></path>
        </svg>
      </button>
      <div class="card-page-title" id="cardTitle"></div>
      <button class="text-btn" id="cardFloat">悬浮</button>
      <button class="text-btn" id="cardCopyAll">复制全文</button>
      <button class="text-btn" id="cardEdit">编辑</button>
    </header>
    <div class="card-read markdown" id="cardBody"></div>
    <div class="card-editor hidden" id="cardEditor">
      <label class="field hidden" id="cardNameField">
        <span>名称</span>
        <input id="cardNameInput" placeholder="比如：科研想法·检索" autocomplete="off" maxlength="40" />
      </label>
      <label class="field">
        <span>用途（这张卡片收什么）</span>
        <input id="cardPurposeInput" placeholder="比如：向量检索方向的想法和待验证的假设" autocomplete="off" maxlength="120" />
      </label>
      <textarea class="brief-text" id="cardText" placeholder="卡片内容（Markdown）。新卡片可以留空。" spellcheck="false"></textarea>
      <div class="actions">
        <button class="primary-btn" id="cardSave">保存</button>
        <button class="secondary-btn" id="cardCopy">复制</button>
        <button class="secondary-btn" id="cardDelete">删除</button>
      </div>
    </div>
  </div>

  <div class="backdrop hidden" id="settingsBackdrop"></div>
  <div class="sheet hidden" id="settingsSheet">
    <div class="sheet-header">
      <div class="sheet-title">设置</div>
      <button class="icon-btn" id="closeSettings" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <label class="field">
        <span>DeepSeek API Key</span>
        <input id="apiKeyInput" type="password" placeholder="sk-..." autocomplete="off" />
      </label>

      <label class="field">
        <span>模型</span>
        <select id="modelSelect">
          <option value="deepseek-flash">DeepSeek Flash（快，推荐）</option>
          <option value="deepseek-v4-pro">DeepSeek V4 Pro（更强）</option>
        </select>
      </label>

      <label class="field">
        <span>朗读音色</span>
        <select id="voiceSelect">
          <option value="stella">女声 Stella</option>
          <option value="tide">男声 Tide</option>
        </select>
      </label>

      <label class="switch-row">
        <span>自动朗读回复</span>
        <input id="autoSpeakInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>联网搜索</span>
        <input id="webSearchInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>计算器</span>
        <input id="calculatorInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>免按住模式（实验）</span>
        <input id="wakeWordInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>播放中允许“Hi Reduction”打断（需耳机）</span>
        <input id="bargeInInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>耳机麦克风（实验）</span>
        <input id="headsetMicInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>允许 sub agent 只读分析项目</span>
        <input id="opencodeEnabledInput" type="checkbox" />
      </label>

      <label class="switch-row">
        <span>允许 sub agent 修改代码和执行任务</span>
        <input id="opencodeWriteInput" type="checkbox" />
      </label>

      <label class="field">
        <span>opencode 会话 ID（可留空）</span>
        <input id="opencodeSessionInput" placeholder="ses_..." autocomplete="off" />
      </label>

      <label class="field">
        <span>opencode 项目目录</span>
        <input id="pcProjectInput" placeholder="/home/user/Reduction-iterate" autocomplete="off" />
      </label>

      <div class="actions">
        <button class="primary-btn" id="saveSettings">保存</button>
        <button class="secondary-btn" id="testTts">测试朗读</button>
        <button class="secondary-btn" id="clearAudioCache">清除音频缓存</button>
        <button class="secondary-btn" id="clearHistory">清空聊天记录</button>
        <button class="secondary-btn" id="shareDiagnostics">分享诊断信息</button>
      </div>

      <div class="app-info" id="appInfo"></div>
    </div>
  </div>

  <div class="backdrop hidden" id="pcBackdrop"></div>
  <div class="sheet hidden" id="pcSheet">
    <div class="sheet-header">
      <div class="sheet-title">电脑</div>
      <button class="icon-btn" id="closePc" aria-label="关闭">×</button>
    </div>
    <div class="sheet-body">
      <div class="pc-status" id="pcStatus">未连接</div>

      <label class="field">
        <span>电脑主机（Tailscale / MagicDNS）</span>
        <input id="pcHostInput" placeholder="desktop.tailnet.ts.net" autocomplete="off" />
      </label>

      <label class="field">
        <span>SSH 端口</span>
        <input id="pcPortInput" type="number" inputmode="numeric" value="22" min="1" max="65535" />
      </label>

      <label class="field">
        <span>SSH 用户</span>
        <input id="pcUserInput" placeholder="Windows 用户名" autocomplete="off" />
      </label>

      <div class="actions">
        <button class="secondary-btn" id="pcTest">连接测试</button>
        <button class="secondary-btn" id="pcCopyKey">复制公钥</button>
      </div>

      <div class="app-info">先连接 Tailscale，并在 Windows 开启 OpenSSH Server。首次连接会固定 host key。</div>

      <label class="field" style="margin-top:16px;">
        <span>执行命令</span>
        <input id="pcCommandInput" placeholder="例如 notepad" autocomplete="off" />
      </label>

      <button class="primary-btn" id="pcRunCommand">执行命令</button>

      <div class="pc-output" id="pcOutput"></div>
    </div>
  </div>

  <div class="backdrop hidden" id="messageBackdrop"></div>
  <div class="message-menu hidden" id="messageMenu">
    <button class="message-action" id="messageCopy">复制</button>
    <button class="message-action" id="messageRead">朗读</button>
  </div>

  <div class="toast hidden" id="toast"></div>

<script src="./vendor/marked.umd.js"></script>
<script src="./vendor/purify.min.js"></script>
<script src="./vendor/katex/katex.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
